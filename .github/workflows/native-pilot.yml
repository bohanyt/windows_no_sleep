name: native-pilot

on:
  push:
    branches:
      - feat/v1-native-winforms
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-self-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native Release x64
        shell: powershell
        run: |
          msbuild .\native\WindowsNoSleep\WindowsNoSleep.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

      - name: Run non-mutating native self-test
        shell: powershell
        run: |
          $exe = Resolve-Path .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Native self-test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'NATIVE_PILOT_SELF_TEST_PASS'

      - name: Package unsigned pilot and record SHA-256
        shell: powershell
        run: |
          $out = '.\artifacts\native-pilot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe $out
          if (Test-Path .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe.config) {
            Copy-Item .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe.config $out
          }
          Copy-Item .\native\README_NATIVE_PILOT.md $out\README.txt

          $hash = Get-FileHash $out\WindowsNoSleep.exe -Algorithm SHA256
          "$($hash.Hash)  WindowsNoSleep.exe" | Set-Content $out\SHA256SUMS.txt -Encoding ascii
          "$env:GITHUB_SHA" | Set-Content $out\BUILD_SHA.txt -Encoding ascii
          "Native pilot SHA-256: $($hash.Hash)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Signing status: UNSIGNED PILOT" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload exact pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsNoSleep-native-pilot
          path: artifacts/native-pilot
          if-no-files-found: error

      - name: Publish rolling dev build
        if: github.event_name == 'push'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = '.\artifacts\native-pilot'
          gh release view dev-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete dev-latest --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace dev-latest release."
            }
          }
          gh release create dev-latest "$out\WindowsNoSleep.exe" "$out\WindowsNoSleep.exe.config" "$out\README.txt" "$out\SHA256SUMS.txt" "$out\BUILD_SHA.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Windows No Sleep dev-latest" --notes "Rolling development build from feat/v1-native-winforms. Unsigned; intended for local testing." --prerelease
