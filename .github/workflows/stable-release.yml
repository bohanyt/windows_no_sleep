name: native-v1-stable

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

concurrency:
  group: native-v1-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-exact-main-artifact:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag points at current main
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -eq 'dev-latest') { throw 'Refusing to replace dev-latest.' }
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Stable tag must be vX.Y.Z.' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the triggering tag commit.' }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -ne $head) { throw 'Stable tag must point to the current main commit.' }
          git fetch --no-tags origin "refs/tags/$tag`:refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "refs/tags/$tag^{commit}").Trim() -ne $head) { throw 'Stable tag identity changed.' }
          $previousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorPreference
          if ($exists) { throw 'Release already exists for this stable tag.' }

      - name: Verify source version and manifest identity
        shell: powershell
        run: |
          python .github\workflows\promote_exact_main_artifact.py verify-source --tag "$env:GITHUB_REF_NAME" --assembly native\WindowsNoSleep\Properties\AssemblyInfo.cs --manifest native\WindowsNoSleep\app.manifest
          if ($LASTEXITCODE -ne 0) { throw 'Source identity verification failed.' }

      - name: Select the successful exact-main native-v1 run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/workflows/native-pilot.yml/runs?head_sha=$env:GITHUB_SHA&branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[] | {id,name,head_branch,head_sha,event,status,conclusion}' | Set-Content .\artifacts\main-runs.jsonl -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query authoritative main runs.' }
          python .github\workflows\promote_exact_main_artifact.py select-run --sha "$env:GITHUB_SHA" --runs .\artifacts\main-runs.jsonl --out .\artifacts\selected-run-id.txt
          if ($LASTEXITCODE -ne 0) { throw 'Exact main run selection failed.' }
          $runId = (Get-Content .\artifacts\selected-run-id.txt -Raw).Trim()
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts" --jq '.artifacts[] | {id,name,expired}' | Set-Content .\artifacts\run-artifacts.jsonl -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query run artifacts.' }
          python .github\workflows\promote_exact_main_artifact.py select-artifact --artifacts .\artifacts\run-artifacts.jsonl --out .\artifacts\selected-artifact-id.txt
          if ($LASTEXITCODE -ne 0) { throw 'Exact artifact selection failed.' }

      - name: Download and verify the exact main package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runId = (Get-Content .\artifacts\selected-run-id.txt -Raw).Trim()
          $version = $env:GITHUB_REF_NAME.Substring(1) + '.0'
          $stage = '.\artifacts\stable-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          gh run download $runId --repo "$env:GITHUB_REPOSITORY" --name WindowsNoSleep-native-pilot --dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the exact main artifact.' }
          python .github\workflows\promote_exact_main_artifact.py verify-package --dir $stage --sha "$env:GITHUB_SHA" --version $version --out .\artifacts\promoted-exe-sha256.txt
          if ($LASTEXITCODE -ne 0) { throw 'Exact package verification failed.' }

      - name: Publish the exact staged bytes
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -eq 'dev-latest') { throw 'Refusing to replace dev-latest.' }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -ne $env:GITHUB_SHA) { throw 'Main moved or cannot be verified; stable publication is blocked.' }
          git fetch --no-tags origin "refs/tags/$tag`:refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "refs/tags/$tag^{commit}").Trim() -ne $env:GITHUB_SHA) { throw 'Stable tag identity changed.' }
          $previousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorPreference
          if ($exists) { throw 'Release already exists for this stable tag.' }
          $runId = (Get-Content .\artifacts\selected-run-id.txt -Raw).Trim()
          $exeHash = (Get-Content .\artifacts\promoted-exe-sha256.txt -Raw).Trim()
          $stage = '.\artifacts\stable-stage'
          $notes = @(
            'Promoted the exact successful main CI artifact. This workflow did not rebuild the executable.'
            "Source SHA: $env:GITHUB_SHA"
            "Source run ID: $runId"
            "EXE SHA-256: $exeHash"
          ) -join "`n"
          @(
            "Promoted source run ID: $runId"
            "EXE SHA-256: $exeHash"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          gh release create "$tag" "$stage\WindowsNoSleep.exe" "$stage\WindowsNoSleep.exe.config" "$stage\README.txt" "$stage\SHA256SUMS.txt" "$stage\BUILD_SHA.txt" --repo "$env:GITHUB_REPOSITORY" --verify-tag --target "$env:GITHUB_SHA" --title "Windows No Sleep $tag" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage the complete stable release.' }
          gh release edit "$tag" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the complete release.' }
