name: native-v1-stable

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: native-v1-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-self-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify stable tag and current main before build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Stable tag must be vX.Y.Z.' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the triggering tag commit.' }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -ne $head) { throw 'Stable tag must point to the current main commit.' }
          $remoteTag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Stable tag is missing.' }
          git fetch --no-tags origin "refs/tags/$tag`:refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "refs/tags/$tag^{commit}").Trim() -ne $head) { throw 'Stable tag identity changed.' }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check native ABI against Windows SDK
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\artifacts -Force | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Windows SDK C++ tools were not found.' }
          $dev = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $command = 'call "{0}" -arch=x64 -host_arch=x64 >nul && cl /nologo /EHsc /c native\tests\AbiCheck.cpp /Fo:artifacts\AbiCheck.obj' -f $dev
          & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native ABI assertions failed.' }

      - name: Build native Release x64
        shell: powershell
        run: |
          msbuild .\native\WindowsNoSleep\WindowsNoSleep.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed.' }

      - name: Verify version metadata matches stable tag
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1) + '.0'
          $source = Get-Content .\native\WindowsNoSleep\Properties\AssemblyInfo.cs -Raw
          foreach ($attribute in @('AssemblyVersion', 'AssemblyFileVersion')) {
            $pattern = '\[assembly:\s*' + $attribute + '\("([^"]+)"\)\]'
            $foundVersions = [regex]::Matches($source, $pattern)
            if ($foundVersions.Count -ne 1 -or $foundVersions[0].Groups[1].Value -ne $version) { throw "$attribute does not match stable tag $version." }
          }
          $exe = Get-Item .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe
          if ($exe.VersionInfo.FileVersion -ne $version -or $exe.VersionInfo.ProductVersion -ne $version) { throw 'Built EXE version does not match stable tag.' }
          [xml]$manifest = Get-Content .\native\WindowsNoSleep\app.manifest -Raw
          $identity = $manifest.SelectSingleNode("/*[local-name()='assembly']/*[local-name()='assemblyIdentity']")
          if ($null -eq $identity -or $identity.version -ne $version -or $identity.name -match 'NativePilot') { throw 'Manifest stable identity is unresolved or inconsistent.' }

      - name: Run non-mutating native power request self-test
        shell: powershell
        run: |
          $exe = Resolve-Path .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Self-test timed out.' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Native power-request test failed: $($process.ExitCode)" }
          Write-Host 'NATIVE_POWER_REQUEST_SELF_TEST_PASS'

      - name: Run battery recovery and controller regression suite
        shell: powershell
        run: |
          $exe = Resolve-Path .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe
          $report = Join-Path (Resolve-Path .\artifacts) 'native-v1-tests.txt'
          $arguments = '--test-suite "{0}"' -f $report
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Regression suite timed out.' }
          $process.Refresh()
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Native regression suite failed: $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Regression suite did not produce evidence.' }

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-v1-test-evidence
          path: artifacts/native-v1-tests.txt
          if-no-files-found: ignore

      - name: Package native V1 and record SHA-256
        shell: powershell
        run: |
          $out = '.\artifacts\native-pilot'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe $out
          Copy-Item .\native\WindowsNoSleep\bin\Release\WindowsNoSleep.exe.config $out
          @(
            "Windows No Sleep $env:GITHUB_REF_NAME - stable release"
            'Portable x64 C# WinForms application for .NET Framework 4.8.'
            'Install through Update Windows No Sleep.cmd with no argument (latest stable channel).'
            'The updater verifies WindowsNoSleep.exe against SHA256SUMS.txt before replacement.'
            'Stop/Exit restores temporary settings where safe; unresolved recovery state is retained.'
            'See https://github.com/bohanyt/windows_no_sleep for behavior, limits and acceptance evidence.'
            'Unsigned; endpoint security compatibility is specific to the tested environment.'
          ) | Set-Content "$out\README.txt" -Encoding utf8
          $hash = Get-FileHash "$out\WindowsNoSleep.exe" -Algorithm SHA256
          "$($hash.Hash)  WindowsNoSleep.exe" | Set-Content "$out\SHA256SUMS.txt" -Encoding ascii
          "$env:GITHUB_SHA" | Set-Content "$out\BUILD_SHA.txt" -Encoding ascii
          "Native V1 EXE SHA-256: $($hash.Hash)" | Add-Content $env:GITHUB_STEP_SUMMARY
          'Signing: unsigned. Stable publication requires separate owner/reviewer approval before this tag is created.' | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload exact application artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsNoSleep-native-pilot
          path: artifacts/native-pilot
          if-no-files-found: error

      - name: Publish stable release after all checks
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $current.Trim() -ne $env:GITHUB_SHA) { throw 'Main moved or cannot be verified; stable publication is blocked.' }
          git fetch --no-tags origin "refs/tags/$tag`:refs/tags/$tag" --force
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "refs/tags/$tag^{commit}").Trim() -ne $env:GITHUB_SHA) { throw 'Stable tag identity changed.' }
          $out = '.\artifacts\native-pilot'
          $previousErrorPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $previousErrorPreference
          if ($exists) { throw 'Release already exists for this stable tag.' }
          gh release create "$tag" "$out\WindowsNoSleep.exe" "$out\WindowsNoSleep.exe.config" "$out\README.txt" "$out\SHA256SUMS.txt" "$out\BUILD_SHA.txt" --repo "$env:GITHUB_REPOSITORY" --verify-tag --target "$env:GITHUB_SHA" --title "Windows No Sleep $tag" --notes 'Native V1 stable release. See README.txt and repository acceptance record. Unsigned.' --draft
          if ($LASTEXITCODE -ne 0) { throw 'Failed to stage the complete stable release.' }
          gh release edit "$tag" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the complete release.' }
